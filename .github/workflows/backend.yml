name: backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 테스트 + 포맷 검사
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정 (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest 러너에는 Docker가 이미 있다. Testcontainers가 이걸 쓴다.
      - name: clean check
        working-directory: backend
        run: ./gradlew clean check --no-daemon

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  deploy:
    name: OCI VM 배포
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정 (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      # 이미지는 이미 만들어진 jar를 COPY만 한다 — RUN이 없어 크로스 빌드에 에뮬레이션이 불필요하다.
      # 컴파일은 여기서(amd64 러너, 네이티브) 미리 끝낸다.
      - name: bootJar 빌드 (네이티브)
        working-directory: backend
        # -Pcommit이 sha를 build-info.properties에 굽는다. 이 값이 deploy.sh의 대조 대상이다
        # (docs/specs/2026-09-05-build-info.md). 런타임 환경변수로 넘기면 구 이미지를
        # 새 sha 이름으로 띄워도 통과해버린다.
        run: ./gradlew bootJar --no-daemon -Pcommit=${{ github.sha }}

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 + 푸시 (arm64, sha + latest)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/sungwoong-noh/kaldi-note-api:${{ github.sha }}
            ghcr.io/sungwoong-noh/kaldi-note-api:latest

      - name: 배포 스크립트를 VM으로 복사
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_VM_SSH_KEY }}
          source: "infra/scripts/deploy.sh"
          target: "/opt/kaldi-note/infra/scripts"
          strip_components: 2

      - name: VM에서 배포 실행
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_VM_SSH_KEY }}
          script: |
            chmod +x /opt/kaldi-note/infra/scripts/deploy.sh
            /opt/kaldi-note/infra/scripts/deploy.sh ${{ github.sha }}
