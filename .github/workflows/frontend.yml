name: frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 타입 + 린트 + 테스트 + 빌드
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: pnpm 설치
        uses: pnpm/action-setup@v4

      - name: Node 22 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 의존성 설치
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 타입 검사
        working-directory: frontend
        run: pnpm typecheck

      - name: 린트
        working-directory: frontend
        run: pnpm lint

      - name: 테스트
        working-directory: frontend
        run: pnpm test

      # 개발 서버에서는 통과하는데 빌드에서 깨지는 경우가 흔하다. 반드시 돌린다.
      - name: 빌드
        working-directory: frontend
        run: pnpm build
