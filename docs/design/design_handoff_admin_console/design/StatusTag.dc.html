<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isRun }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.08em;padding:3px 7px;border-radius:3px;background:var(--a-wash);color:var(--a-accent);white-space:nowrap">● RUNNING</span></sc-if><sc-if value="{{ isOk }}" hint-placeholder-val="{{ true }}"><span style="display:inline-block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.08em;padding:3px 7px;border-radius:3px;background:var(--a-sunken);color:var(--a-ink2);white-space:nowrap">SUCCEEDED</span></sc-if><sc-if value="{{ isFail }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.08em;padding:3px 7px;border-radius:3px;background:var(--a-ink);color:var(--a-paper);white-space:nowrap">FAILED</span></sc-if><sc-if value="{{ isInt }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.08em;padding:2px 6px;border-radius:3px;border:1px dashed var(--a-ink3);color:var(--a-ink2);white-space:nowrap">INTERRUPTED</span></sc-if><sc-if value="{{ isNone }}" hint-placeholder-val="{{ false }}"><span style="font-family:var(--font-mono);font-size:11px;color:var(--a-ink3)">—</span></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;RUNNING&quot;,&quot;SUCCEEDED&quot;,&quot;FAILED&quot;,&quot;INTERRUPTED&quot;,&quot;&quot;],&quot;default&quot;:&quot;SUCCEEDED&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.status;
    return { isRun: s === 'RUNNING', isOk: s === 'SUCCEEDED', isFail: s === 'FAILED', isInt: s === 'INTERRUPTED', isNone: !s };
  }
}
</script>
</body>
</html>
