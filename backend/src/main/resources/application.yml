spring:
  application:
    name: kaldi-note-api
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway가 스키마 소유자. 절대 update로 바꾸지 말 것
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
