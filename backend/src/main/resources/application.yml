spring:
  application:
    name: kaldi-note-api
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway가 스키마 소유자. 절대 update로 바꾸지 말 것
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

kaldi:
  jwt:
    # HS256은 최소 256비트(32바이트) 키가 필요하다. 운영은 환경변수로 주입한다.
    secret: ${KALDI_JWT_SECRET}
    access-token-ttl: PT30M
    refresh-token-ttl: P14D
    issuer: kaldi-note
